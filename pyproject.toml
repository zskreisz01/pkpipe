[project]
name = "pkpipe"
version = "0.0.1"
description = "Personal Knowledge Pipeline – local-first agent pipeline: Obsidian INBOX -> triage -> guarded LLM sessions -> curated notes"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "apprise>=2.1.0",
    "apscheduler>=3.11,<4",
    "fastapi>=0.162.0",
    "fastmcp>=4.1.4",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "openinference-instrumentation-langchain>=0.1.81",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "pydantic>=2",
    "python-frontmatter>=1.3.0",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
# web-fetch MCP server fallback browser (spec 008): `uv sync --extra webfetch && uv run playwright install chromium`
webfetch = ["playwright>=1.64.1"]
# Local classifiers (spec 008/009, docs/decisions/0001): Qwen3Guard-Gen and ProtectAI DeBERTa, read from local
# directories only: `uv sync --extra guard`
guard = ["transformers>=4.57", "torch>=2.8"]
# Image input (spec 021): decoding, EXIF removal, scaling and re-encoding of INBOX images before a vision model
# sees them: `uv sync --extra images`
images = ["pillow>=11"]

[project.scripts]
pkpipe = "pkpipe.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "mypy>=2.4.1",
    "opentelemetry-sdk>=1.45.2",
    "pillow>=11",  # synthetic test images (spec 021); also in the optional extra `images`
    "playwright>=1.64.1",
    "pytest>=8",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
# a hung test (for example a live test against an unresponsive local service) fails after 15 minutes
timeout = 900
# --dist worksteal only matters with -n (pytest-xdist): `uv run pytest -n auto -m "not live"`, tests/README.md
addopts = "-ra --strict-markers -p pytester --dist worksteal"
markers = [
    "live: needs a real local service (LM Studio, Docker, Lightpanda); auto-skipped when unreachable, see tests/README.md",
    "docs: builds the Docusaurus site with npm (slow); skipped when website/node_modules is missing",
    "real_classifier: e2e test keeps the real app.make_classifier (else tests/e2e/conftest.py swaps in a fake)",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# Type checking is introduced with spec 020: these modules are clean; widen the list as others are annotated.
[tool.mypy]
python_version = "3.12"
files = [
  "src/pkpipe/domain/layout.py",
  "src/pkpipe/domain/inbox_list.py",
  "src/pkpipe/obsidian/policy.py",
  "src/pkpipe/obsidian/vault.py",
  "src/pkpipe/steps/triage_code.py",
  "src/pkpipe/domain/vault_snapshot.py",
  "src/pkpipe/obsidian/scope.py",
  "src/pkpipe/adapters/snapshot_files.py",
  "src/pkpipe/engine/restore.py",
  # spec 021
  "src/pkpipe/domain/images.py",
  "src/pkpipe/domain/image_batch.py",
  "src/pkpipe/domain/data_classes.py",
  "src/pkpipe/steps/image_code.py",
  "src/pkpipe/adapters/image_pillow.py",
]
ignore_missing_imports = true
follow_imports = "silent"
