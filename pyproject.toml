[project]
name = "pkpipe"
version = "0.0.1"
description = "Personal Knowledge Pipeline – local-first agent pipeline: Obsidian INBOX -> triage -> guarded LLM sessions -> curated notes"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "apprise>=2.1.0",
    "apscheduler>=3.11,<4",
    "fastapi>=0.162.0",
    "fastmcp>=4.1.4",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "openinference-instrumentation-langchain>=0.1.81",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "pydantic>=2",
    "python-frontmatter>=1.3.0",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
# web-fetch MCP server fallback browser (spec 008): `uv sync --extra webfetch && uv run playwright install chromium`
webfetch = ["playwright>=1.64.1"]
# Prompt Guard 2 classifier (spec 008): `uv sync --extra promptguard`; the gated model is read from a local dir
promptguard = ["transformers>=4.57", "torch>=2.8"]

[project.scripts]
pkpipe = "pkpipe.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "opentelemetry-sdk>=1.45.2",
    "playwright>=1.64.1",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -p pytester"
markers = [
    "live: needs a real local service (LM Studio, Docker, Lightpanda); auto-skipped when unreachable, see tests/README.md",
    "docs: builds the Docusaurus site with npm (slow); skipped when website/node_modules is missing",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
