# Optional helper services. The app itself runs with `uv run pkpipe serve`.
services:
  searxng:
    image: searxng/searxng:latest
    ports: ["127.0.0.1:8080:8080"]
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET (any long random string)}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro   # enables the JSON API (spec 017)
  phoenix:
    image: arizephoenix/phoenix:latest
    # UI and OTLP/HTTP on 6006 (/v1/traces), OTLP/gRPC on 4317
    ports: ["127.0.0.1:6006:6006", "127.0.0.1:4317:4317"]
    environment:
      PHOENIX_WORKING_DIR: /mnt/data   # SQLite database lives here
      PHOENIX_ENABLE_AUTH: "false"     # local-only (127.0.0.1) dev backend; enable auth before exposing it
    volumes:
      - phoenix-data:/mnt/data
  # open-notebook + Speaches TTS: see deploy/open-notebook/
  # lightpanda: see the Lightpanda docs for the current image

volumes:
  phoenix-data:
