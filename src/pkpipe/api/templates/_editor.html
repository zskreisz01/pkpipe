{% if draft %}
<form hx-post="/ui/config/save" hx-target="#editor" hx-swap="innerHTML">
  <input type="hidden" name="draft_id" value="{{ draft.draft_id }}">
  <input type="hidden" name="rev" value="{{ draft.rev }}">
  <input type="hidden" name="path" value="{{ info.path }}">
  <input type="hidden" name="base_hash" value="{{ draft.files[info.path].base_hash if info.path in draft.files else info.base_hash }}">
  <textarea name="content" spellcheck="false" aria-label="file content">{{ content }}</textarea>
  <p class="row"><button class="primary" type="submit">Save to draft</button>
  {% if message %}<span class="{{ 'err' if error else 'ok' }}" data-testid="editor-message">{{ message }}</span>{% endif %}</p>
</form>
{% else %}
<pre>{{ content }}</pre><p class="muted">Read-only.</p>
{% endif %}
