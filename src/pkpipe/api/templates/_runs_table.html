{% if message %}<p class="{{ 'err' if error else 'ok' }}" data-testid="runs-message">{{ message }}</p>{% endif %}
<table>
  <thead><tr><th>Run</th><th>Flow</th><th>Status</th><th>Trigger</th><th>Started</th></tr></thead>
  <tbody>
  {% for r in runs %}
  <tr><td><a href="/runs/{{ r.run_id }}"><code>{{ r.run_id[:8] }}</code></a></td><td>{{ r.flow_id }}</td>
      <td><span class="pill {{ r.status }}">{{ r.status }}</span></td><td>{{ r.trigger }}</td><td>{{ r.started_at[:19] }}</td></tr>
  {% else %}<tr><td colspan="5" class="muted">No runs yet.</td></tr>{% endfor %}
  </tbody>
</table>
