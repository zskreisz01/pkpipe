{% extends "base.html" %}
{% block title %}Audit{% endblock %}
{% block body %}
<h1>Owner actions</h1>
<table><thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Target</th><th>Detail</th></tr></thead><tbody>
{% for e in entries %}<tr><td>{{ e.at[:19] }}</td><td>{{ e.actor }}</td><td>{{ e.action }}</td><td><code>{{ e.target or "" }}</code></td><td><code>{{ e.detail }}</code></td></tr>
{% else %}<tr><td colspan="5" class="muted">Nothing recorded.</td></tr>{% endfor %}
</tbody></table>
{% endblock %}
