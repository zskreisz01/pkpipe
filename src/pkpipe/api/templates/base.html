<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false, "selfRequestsOnly": true}'>
<title>{% block title %}pkpipe{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.min.js"></script>
<script src="/static/config-forms.js" defer></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf }}"}'>
{% if owner %}
<header>
  <strong>pkpipe</strong>
  <a href="/pipeline" data-testid="nav-pipeline">Pipeline</a><a href="/">Overview</a><a href="/triage">Triage</a><a href="/items">Items</a><a href="/runs">Runs</a><a href="/config">Config</a><a href="/audit">Audit</a>
  <form method="post" action="/logout" hx-boost="false"><button type="submit">Log out</button></form>
</header>
{% endif %}
<main>{% block body %}{% endblock %}</main>
</body>
</html>
