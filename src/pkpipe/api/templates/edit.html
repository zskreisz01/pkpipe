{% extends "base.html" %}
{% block title %}Edit {{ info.path }}{% endblock %}
{% block body %}
<h1>{{ info.path }}</h1>
{% if form_link %}<nav class="tabs" aria-label="editor view"><a class="pill" href="/config/form?path={{ info.path|urlencode }}">Form</a> <span class="pill done" aria-current="page">JSON</span></nav>{% endif %}
<p class="muted">Source: {{ info.source }}. Edits go to a draft; nothing changes until you publish. <a href="/config">Back to config</a></p>
<div id="editor">{% include "_editor.html" %}</div>
{% endblock %}
