name: CI

on:
  pull_request:
  push:
    branches: [master, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # non-live tests in parallel (pytest-xdist); the live tests (LM Studio, Docker, Lightpanda) run serially
      # and auto-skip here because the services are not reachable (tests/README.md)
      - run: uv run pytest -q -n auto -m 'not live'
      - run: uv run pytest -q -m live

  docs-build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
